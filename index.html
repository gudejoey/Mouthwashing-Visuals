<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }

      /* ── Default (viewer) layout ── */
      #frame {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
      }
      #presenter-bar {
        display: none;
      }

      /* ── Presenter (host) layout ── */
      body.presenter-mode {
        display: flex;
        flex-direction: column;
      }
      body.presenter-mode #frame {
        width: 100%;
        height: calc(100vh - 152px);
        flex-shrink: 0;
      }
      body.presenter-mode #overlay {
        bottom: 152px; /* leave preview bar clickable */
      }
      body.presenter-mode #presenter-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 152px;
        background: #111;
        border-top: 1px solid #222;
        padding: 0 12px;
        flex-shrink: 0;
        overflow: hidden;
      }

      /* Preview cards */
      .preview-card {
        position: relative;
        width: 192px;
        height: 108px;
        overflow: hidden;
        border: 2px solid #333;
        border-radius: 4px;
        cursor: pointer;
        flex-shrink: 0;
        transition: border-color 0.1s;
      }
      .preview-card:hover {
        border-color: #666;
      }
      .preview-card.active {
        border-color: #fff;
        box-shadow: 0 0 0 1px #fff;
      }
      .preview-card.empty {
        background: #0a0a0a;
        cursor: default;
        border-color: #1a1a1a;
      }
      .preview-card iframe {
        width: 1920px;
        height: 1080px;
        transform: scale(0.1);
        transform-origin: top left;
        pointer-events: none;
        border: none;
      }
      .preview-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.75);
        color: rgba(255, 255, 255, 0.7);
        font-family: monospace;
        font-size: 9px;
        padding: 2px 4px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview-card.active .preview-label {
        color: #fff;
      }

      /* Transparent overlay keeps keyboard focus on the parent page */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: transparent;
      }
      #hud {
        position: fixed;
        bottom: 16px;
        right: 20px;
        z-index: 9999;
        pointer-events: none;
        font-family: monospace;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.08em;
        transition: opacity 0.2s;
      }
      body.presenter-mode #hud {
        bottom: 168px; /* sit above the preview bar */
      }

      /* N key toggles UI visibility */
      body.ui-hidden #hud    { opacity: 0; }
      body.ui-hidden,
      body.ui-hidden #overlay { cursor: none; }
    </style>
  </head>
  <body>
    <iframe id="frame" allow="autoplay; fullscreen"></iframe>
    <div id="overlay"></div>
    <div id="hud"></div>
    <div id="presenter-bar"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
      // ═══════════════════════════════════════════════════════════
      //  MASTER CONFIGURATION — only edit values in this block
      // ═══════════════════════════════════════════════════════════

      const TRANSITION_SOUND = ""; // ← replace with your audio file path
      //   e.g.  "sounds/transition.mp3"

      // ── Firebase config (fill in from Firebase Console) ────────
      //   firebase.google.com → your project → Project settings → Your apps
      const firebaseConfig = {
        apiKey: "AIzaSyB4zuxfFvcZb3d2qQCIt1xROtTbbPyJtqk",
        authDomain: "mouthwashing-visuals.firebaseapp.com",
        databaseURL: "https://mouthwashing-visuals-default-rtdb.firebaseio.com/",
        projectId: "mouthwashing-visuals",
        storageBucket: "mouthwashing-visuals.firebasestorage.app",
        messagingSenderId: "903836033913",
        appId: "1:903836033913:web:44ce661f530a1450cec5a8",
        measurementId: "G-D2SHZCY3DP",
      };

      const SLIDES = [
        "black.html", // Black screen (start)
        "1.html",     // Opening info card
        "black.html",
        "2.html",     // 0 days before the crash
        "black.html",
        "3.html",     // Orbital body detected (typewriter)
        "black.html",
        "4.html",     // Extreme warning, collision course (typewriter)
        "black.html",
        "5.html",     // AUTOPILOT DISENGAGED / BRACE FOR IMPACT (flash)
        "black.html",
        "6.html",     // 7 days before the crash
        "black.html",
        "7.html",     // ////// Apologize //////
        "black.html",
        "8.html",     // ////// Talk to Jimmy //////
        "black.html",
        "9.html",     // 2 months after the crash
        "black.html",
        "10.html",    // MESSAGE INCOMING (flash)
        "11.html",    // Mouthwashing ad video (no black before)
        "black.html",
        "35.html",    // 6 days before the crash
        "black.html",
        "12.html",    // 3 months after the crash
        "36.html",    // pony.MOV video (no black before)
        "black.html",
        "13.html",    // 4 months after the crash
        "black.html",
        "14.html",    // ////// Break The Foam //////
        "black.html",
        "15.html",    // Take Responsibility — Take Care Of It
        "black.html",
        "16.html",    // 4 days before the crash
        "black.html",
        "17.html",    // Safety
        "black.html",
        "18.html",    // 5 months after the crash
        "black.html",
        "19.html",    // ////// Save him //////
        "black.html",
        "20.html",    // ////// Deal With Swansea //////
        "black.html",
        "21.html",    // 8 hours until judgement
        "black.html",
        "22.html",    // 1 day before the crash
        "black.html",
        "23.html",    // ////// Find The Gun //////
        "black.html",
        "24.html",    // 6 hours until judgement
        "black.html",
        "25.html",    // ////// Get The Gun //////
        "black.html",
        "26.html",    // 0 days before the crash (red)
        "black.html",
        "27.html",    // Kills Ninety Nine Percent — Take Care Of It
        "black.html",
        "28.html",    // Kills Ninety Nine Percent ×3 (fast fade)
        "black.html",
        "29.html",    // System Failure (flash)
        "black.html",
        "30.html",    // ////// Take Care of Swansea //////
        "black.html",
        "31.html",    // ////// Say Sorry //////
        "black.html",
        "32.html",    // ////// Apologize //////
        "black.html",
        "33.html",    // 0 hours before judgement
        "black.html",
        "34.html",    // ////// Go Home //////
        "black.html", // Black screen (end)
      ];

      // ═══════════════════════════════════════════════════════════

      // Host mode: open index.html?host to control the presentation.
      // All other visitors are viewers and cannot advance slides.
      const isHost = new URLSearchParams(location.search).has("host");

      // Initialise Firebase and get a reference to the shared slide state.
      firebase.initializeApp(firebaseConfig);
      const slideRef = firebase.database().ref("currentSlide");

      let current = 0;
      const frame   = document.getElementById("frame");
      const hud     = document.getElementById("hud");
      const overlay = document.getElementById("overlay");

      // Apply presenter layout for the host
      if (isHost) document.body.classList.add("presenter-mode");

      // Build audio object once so replay is instant (seek to 0 each time)
      let audio = null;
      if (TRANSITION_SOUND) {
        audio = new Audio(TRANSITION_SOUND);
        audio.preload = "auto";
      }

      function playSound() {
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      // ── Presenter preview bar ──────────────────────────────────
      const PREVIEW_SLOTS = 5;   // total cards shown (2 before + current + 2 after)
      const PREVIEW_OFFSET = 2;  // index of the "current" card in the row

      let previewSlots = []; // { card, iframe, label }

      function initPreviewBar() {
        if (!isHost) return;
        const bar = document.getElementById("presenter-bar");
        for (let i = 0; i < PREVIEW_SLOTS; i++) {
          const card  = document.createElement("div");
          const pIframe = document.createElement("iframe");
          const label = document.createElement("div");

          card.className  = "preview-card";
          label.className = "preview-label";
          pIframe.allow   = "autoplay";

          card.appendChild(pIframe);
          card.appendChild(label);
          bar.appendChild(card);

          previewSlots.push({ card, iframe: pIframe, label });

          // Capture slot offset at creation time so click always works
          const slotOffset = i - PREVIEW_OFFSET;
          card.addEventListener("click", () => {
            const target = current + slotOffset;
            if (target >= 0 && target < SLIDES.length) goTo(target);
          });
        }
      }

      function updatePreviewBar() {
        if (!isHost) return;
        previewSlots.forEach((slot, i) => {
          const slotOffset  = i - PREVIEW_OFFSET;
          const slideIndex  = current + slotOffset;
          const inRange     = slideIndex >= 0 && slideIndex < SLIDES.length;

          slot.card.classList.toggle("active", slotOffset === 0);
          slot.card.classList.toggle("empty",  !inRange);

          if (inRange) {
            const newSrc = SLIDES[slideIndex];
            // Only update src when the slide actually changes to avoid reloads
            if (!slot.iframe.src.endsWith(newSrc)) slot.iframe.src = newSrc;
            slot.label.textContent = `${slideIndex + 1}  ${newSrc}`;
          } else {
            slot.iframe.src = "about:blank";
            slot.label.textContent = "";
          }
        });
      }

      // ── Core slide functions ───────────────────────────────────

      // loadSlide: update local state only, no Firebase write.
      function loadSlide(index) {
        current = Math.max(0, Math.min(SLIDES.length - 1, index));
        frame.src = SLIDES[current];
        const mode = isHost ? "HOST  " : "VIEWER  ";
        hud.textContent = `${mode}${current + 1} / ${SLIDES.length}  —  ${SLIDES[current]}`;
        updatePreviewBar();
      }

      // goTo: update local state AND broadcast to Firebase (host only).
      function goTo(index) {
        loadSlide(index);
        if (isHost) slideRef.set(current);
      }

      // Listen for slide changes pushed from the host via Firebase.
      // Fires immediately on connect with the current stored value,
      // so viewers always snap to the right slide when they load.
      slideRef.on("value", (snap) => {
        const val = snap.val();
        if (val !== null && val !== current) loadSlide(val);
      });

      // After each slide loads, play any video inside the iframe.
      frame.addEventListener("load", () => {
        try {
          const video = frame.contentDocument.querySelector("video");
          if (video) video.play().catch(() => {});
        } catch (e) {}
      });

      // ── Focus lock ─────────────────────────────────────────────
      overlay.addEventListener("click", () => window.focus());
      window.addEventListener("blur", () => {
        setTimeout(() => window.focus(), 0);
      });

      // ── Key handling ───────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        // N and F work for everyone
        if (e.key === "n" || e.key === "N") {
          document.body.classList.toggle("ui-hidden");
          return;
        }
        if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
          return;
        }

        // Navigation: host only
        if (!isHost) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") {
          e.preventDefault();
          playSound();
          goTo(current + 1);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault();
          playSound();
          goTo(current - 1);
        }
      });

      // Start on first slide locally; Firebase listener will immediately
      // override to the stored value if one exists.
      initPreviewBar();
      loadSlide(0);
    </script>
  </body>
</html>
