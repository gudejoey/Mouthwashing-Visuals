<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }

      /* ── Default (viewer) layout ── */
      #frame {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
      }
      #presenter-bar { display: none; }

      /* ── Presenter (host) layout ── */
      body.presenter-mode {
        display: flex;
        flex-direction: column;
      }
      body.presenter-mode #frame {
        width: 100%;
        height: calc(100vh - 152px);
        flex-shrink: 0;
      }
      body.presenter-mode #overlay {
        bottom: 152px;
      }
      body.presenter-mode #presenter-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 152px;
        background: #111;
        border-top: 1px solid #222;
        padding: 0 16px;
        flex-shrink: 0;
        overflow: hidden;
      }

      /* ── Full preview card (content slides) ── */
      .preview-card {
        position: relative;
        width: 192px;
        height: 108px;
        overflow: hidden;
        border: 2px solid #333;
        border-radius: 4px;
        cursor: pointer;
        flex-shrink: 0;
        transition: border-color 0.1s;
        background: #000;
      }
      .preview-card:hover       { border-color: #666; }
      .preview-card.active      { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
      .preview-card.empty       { background: #0a0a0a; cursor: default; border-color: #1a1a1a; }
      .preview-card iframe {
        width: 1920px;
        height: 1080px;
        transform: scale(0.1);
        transform-origin: top left;
        pointer-events: none;
        border: none;
      }
      .preview-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.78);
        color: rgba(255, 255, 255, 0.65);
        font-family: monospace;
        font-size: 9px;
        padding: 3px 5px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview-card.active .preview-label { color: #fff; }

      /* ── Slim black-slide divider ── */
      .preview-card.black-slide {
        width: 20px;
        border-color: #1e1e1e;
        cursor: pointer;
        background: #000;
      }
      .preview-card.black-slide iframe  { display: none; }
      .preview-card.black-slide .preview-label { display: none; }
      .preview-card.black-slide:hover   { border-color: #444; }
      .preview-card.black-slide.active  { border-color: #fff; box-shadow: 0 0 0 1px #fff; }

      /* Overlay / HUD */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: transparent;
      }
      #hud {
        position: fixed;
        bottom: 16px;
        right: 20px;
        z-index: 9999;
        pointer-events: none;
        font-family: monospace;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.08em;
        transition: opacity 0.2s;
      }
      body.presenter-mode #hud { bottom: 168px; }
      body.ui-hidden #hud      { opacity: 0; }
      body.ui-hidden,
      body.ui-hidden #overlay  { cursor: none; }
    </style>
  </head>
  <body>
    <iframe id="frame" allow="autoplay; fullscreen"></iframe>
    <div id="overlay"></div>
    <div id="hud"></div>
    <div id="presenter-bar"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
      // ═══════════════════════════════════════════════════════════
      //  MASTER CONFIGURATION — only edit values in this block
      // ═══════════════════════════════════════════════════════════

      const TRANSITION_SOUND = "";

      const firebaseConfig = {
        apiKey: "AIzaSyB4zuxfFvcZb3d2qQCIt1xROtTbbPyJtqk",
        authDomain: "mouthwashing-visuals.firebaseapp.com",
        databaseURL: "https://mouthwashing-visuals-default-rtdb.firebaseio.com/",
        projectId: "mouthwashing-visuals",
        storageBucket: "mouthwashing-visuals.firebasestorage.app",
        messagingSenderId: "903836033913",
        appId: "1:903836033913:web:44ce661f530a1450cec5a8",
        measurementId: "G-D2SHZCY3DP",
      };

      const SLIDES = [
        "black.html", // Black screen (start)
        "1.html",     // Opening info card
        "black.html",
        "2.html",     // 0 days before the crash
        "black.html",
        "3.html",     // Orbital body detected (typewriter)
        "black.html",
        "4.html",     // Extreme warning, collision course (typewriter)
        "black.html",
        "5.html",     // AUTOPILOT DISENGAGED / BRACE FOR IMPACT (flash)
        "black.html",
        "6.html",     // 7 days before the crash
        "black.html",
        "7.html",     // ////// Apologize //////
        "black.html",
        "8.html",     // ////// Talk to Jimmy //////
        "black.html",
        "9.html",     // 2 months after the crash
        "black.html",
        "10.html",    // MESSAGE INCOMING (flash)
        "11.html",    // Mouthwashing ad video (no black before)
        "black.html",
        "35.html",    // 6 days before the crash
        "black.html",
        "12.html",    // 3 months after the crash
        "36.html",    // pony.MOV video (no black before)
        "black.html",
        "13.html",    // 4 months after the crash
        "black.html",
        "14.html",    // ////// Break The Foam //////
        "black.html",
        "15.html",    // Take Responsibility — Take Care Of It
        "black.html",
        "16.html",    // 4 days before the crash
        "black.html",
        "17.html",    // Safety
        "black.html",
        "18.html",    // 5 months after the crash
        "black.html",
        "19.html",    // ////// Save him //////
        "black.html",
        "20.html",    // ////// Deal With Swansea //////
        "black.html",
        "21.html",    // 8 hours until judgement
        "black.html",
        "22.html",    // 1 day before the crash
        "black.html",
        "23.html",    // ////// Find The Gun //////
        "black.html",
        "24.html",    // 6 hours until judgement
        "black.html",
        "25.html",    // ////// Get The Gun //////
        "black.html",
        "26.html",    // 0 days before the crash (red)
        "black.html",
        "27.html",    // Kills Ninety Nine Percent — Take Care Of It
        "black.html",
        "28.html",    // Kills Ninety Nine Percent ×3 (fast fade)
        "black.html",
        "29.html",    // System Failure (flash)
        "black.html",
        "30.html",    // ////// Take Care of Swansea //////
        "black.html",
        "31.html",    // ////// Say Sorry //////
        "black.html",
        "32.html",    // ////// Apologize //////
        "black.html",
        "33.html",    // 0 hours before judgement
        "black.html",
        "34.html",    // ////// Go Home //////
        "black.html", // Black screen (end)
      ];

      // Human-readable labels shown in the preview bar (keyed by filename)
      const SLIDE_LABELS = {
        "black.html": "",
        "1.html":  "Opening info card",
        "2.html":  "0 days before the crash",
        "3.html":  "Orbital body detected",
        "4.html":  "Extreme warning — collision course",
        "5.html":  "AUTOPILOT DISENGAGED / BRACE FOR IMPACT",
        "6.html":  "7 days before the crash",
        "7.html":  "////// Apologize //////",
        "8.html":  "////// Talk to Jimmy //////",
        "9.html":  "2 months after the crash",
        "10.html": "MESSAGE INCOMING",
        "11.html": "Mouthwashing ad (video)",
        "12.html": "3 months after the crash",
        "13.html": "4 months after the crash",
        "14.html": "////// Break The Foam //////",
        "15.html": "Take Responsibility — Take Care Of It",
        "16.html": "4 days before the crash",
        "17.html": "Safety",
        "18.html": "5 months after the crash",
        "19.html": "////// Save him //////",
        "20.html": "////// Deal With Swansea //////",
        "21.html": "8 hours until judgement",
        "22.html": "1 day before the crash",
        "23.html": "////// Find The Gun //////",
        "24.html": "6 hours until judgement",
        "25.html": "////// Get The Gun //////",
        "26.html": "0 days before the crash (red)",
        "27.html": "Kills 99% — Take Care Of It",
        "28.html": "Kills 99% ×3 (fast fade)",
        "29.html": "System Failure",
        "30.html": "////// Take Care of Swansea //////",
        "31.html": "////// Say Sorry //////",
        "32.html": "////// Apologize //////",
        "33.html": "0 hours before judgement",
        "34.html": "////// Go Home //////",
        "35.html": "6 days before the crash",
        "36.html": "Pony (video)",
      };

      // CSS injected into every preview iframe to:
      //   1. hide the VHS scanline / vignette overlays
      //   2. fast-forward all animations to their finished state
      //   3. hide videos (handled separately via JS below)
      const PREVIEW_INJECT_CSS = `
        body::before, body::after { display: none !important; }
        * {
          animation-duration:        0.001ms !important;
          animation-delay:           0ms     !important;
          animation-iteration-count: 1       !important;
          transition-duration:       0.001ms !important;
          transition-delay:          0ms     !important;
        }
      `;

      // ═══════════════════════════════════════════════════════════

      const isHost = new URLSearchParams(location.search).has("host");

      firebase.initializeApp(firebaseConfig);
      const slideRef = firebase.database().ref("currentSlide");

      let current = 0;
      const frame   = document.getElementById("frame");
      const hud     = document.getElementById("hud");
      const overlay = document.getElementById("overlay");

      if (isHost) document.body.classList.add("presenter-mode");

      let audio = null;
      if (TRANSITION_SOUND) {
        audio = new Audio(TRANSITION_SOUND);
        audio.preload = "auto";
      }

      function playSound() {
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      // ── Presenter preview bar ──────────────────────────────────
      const PREVIEW_SLOTS  = 7;
      const PREVIEW_OFFSET = 3; // current card is at position 3 (0-indexed)

      let previewSlots = [];

      function injectPreviewStyles(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc || !doc.head) return;

          // Freeze / fast-forward animations and hide VHS overlays
          const style = doc.createElement("style");
          style.textContent = PREVIEW_INJECT_CSS;
          doc.head.appendChild(style);

          // Mute and freeze any video so it shows a static first frame
          const video = doc.querySelector("video");
          if (video) {
            video.muted        = true;
            video.autoplay     = false;
            video.currentTime  = 0;
            video.pause();
          }
        } catch (e) {}
      }

      function initPreviewBar() {
        if (!isHost) return;
        const bar = document.getElementById("presenter-bar");

        for (let i = 0; i < PREVIEW_SLOTS; i++) {
          const card   = document.createElement("div");
          const label  = document.createElement("div");
          const pFrame = document.createElement("iframe");

          card.className  = "preview-card";
          label.className = "preview-label";
          pFrame.allow    = "autoplay";

          card.appendChild(pFrame);
          card.appendChild(label);
          bar.appendChild(card);

          pFrame.addEventListener("load", () => injectPreviewStyles(pFrame));

          const slotOffset = i - PREVIEW_OFFSET;
          card.addEventListener("click", () => {
            const target = current + slotOffset;
            if (target >= 0 && target < SLIDES.length) goTo(target);
          });

          previewSlots.push({ card, iframe: pFrame, label });
        }
      }

      function updatePreviewBar() {
        if (!isHost) return;
        previewSlots.forEach((slot, i) => {
          const slotOffset = i - PREVIEW_OFFSET;
          const idx        = current + slotOffset;
          const inRange    = idx >= 0 && idx < SLIDES.length;
          const file       = inRange ? SLIDES[idx] : null;
          const isBlack    = file === "black.html";

          slot.card.classList.toggle("active",      slotOffset === 0);
          slot.card.classList.toggle("empty",       !inRange);
          slot.card.classList.toggle("black-slide", isBlack);

          if (inRange && !isBlack) {
            const newSrc = file;
            // Only update src when the slide actually changes to avoid unnecessary reloads
            if (!slot.iframe.src.endsWith("/" + newSrc) && !slot.iframe.src.endsWith(newSrc)) {
              slot.iframe.src = newSrc;
            }
            slot.label.textContent = `${idx + 1}  ${SLIDE_LABELS[newSrc] ?? newSrc}`;
          } else {
            if (!isBlack) slot.iframe.src = "about:blank";
            slot.label.textContent = "";
          }
        });
      }

      // ── Core slide functions ───────────────────────────────────

      function loadSlide(index) {
        current = Math.max(0, Math.min(SLIDES.length - 1, index));
        frame.src = SLIDES[current];
        const mode = isHost ? "HOST  " : "VIEWER  ";
        hud.textContent = `${mode}${current + 1} / ${SLIDES.length}  —  ${SLIDES[current]}`;
        updatePreviewBar();
      }

      function goTo(index) {
        loadSlide(index);
        if (isHost) slideRef.set(current);
      }

      slideRef.on("value", (snap) => {
        const val = snap.val();
        if (val !== null && val !== current) loadSlide(val);
      });

      frame.addEventListener("load", () => {
        try {
          const video = frame.contentDocument.querySelector("video");
          if (video) video.play().catch(() => {});
        } catch (e) {}
      });

      // ── Focus lock ─────────────────────────────────────────────
      overlay.addEventListener("click", () => window.focus());
      window.addEventListener("blur",  () => setTimeout(() => window.focus(), 0));

      // ── Key handling ───────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        // N and F work for everyone
        if (e.key === "n" || e.key === "N") {
          document.body.classList.toggle("ui-hidden");
          return;
        }
        if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
          return;
        }

        // Navigation: host only
        if (!isHost) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") {
          e.preventDefault();
          playSound();
          goTo(current + 1);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault();
          playSound();
          goTo(current - 1);
        }
      });

      initPreviewBar();
      loadSlide(0);
    </script>
  </body>
</html>
