<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }

      /* ── Viewer layout ── */
      #frame { width: 100vw; height: 100vh; border: none; display: block; }
      #presenter-bar { display: none; }

      /* ── Host / presenter layout ── */
      body.presenter-mode { display: flex; flex-direction: column; }
      body.presenter-mode #frame {
        width: 100%;
        height: calc(100vh - 152px);
        flex-shrink: 0;
      }
      body.presenter-mode #overlay { bottom: 152px; }
      body.presenter-mode #presenter-bar {
        display: block;
        position: relative;
        height: 152px;
        background: #111;
        border-top: 1px solid #222;
        overflow: hidden;
        flex-shrink: 0;
      }

      /* Scrolling track — contains every card, never removed from DOM */
      #preview-track {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        padding: 0 24px;
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
      }

      /* Full content card */
      .preview-card {
        position: relative;
        width: 192px;
        height: 108px;
        overflow: hidden;
        border: 2px solid #333;
        border-radius: 4px;
        cursor: pointer;
        flex-shrink: 0;
        background: #000;
        transition: border-color 0.15s;
      }
      .preview-card:hover  { border-color: #666; }
      .preview-card.active { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
      .preview-card iframe {
        width: 1920px;
        height: 1080px;
        transform: scale(0.1);
        transform-origin: top left;
        pointer-events: none;
        border: none;
        display: block;
      }
      .preview-label {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.78);
        color: rgba(255,255,255,0.65);
        font-family: monospace;
        font-size: 9px;
        padding: 3px 5px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview-card.active .preview-label { color: #fff; }

      /* Slim divider for black slides */
      .preview-card.black-slide {
        width: 18px;
        background: #000;
        border-color: #1e1e1e;
      }
      .preview-card.black-slide iframe,
      .preview-card.black-slide .preview-label { display: none; }
      .preview-card.black-slide:hover  { border-color: #444; }
      .preview-card.black-slide.active { border-color: #fff; box-shadow: 0 0 0 1px #fff; }

      /* Overlay / HUD */
      #overlay { position: fixed; inset: 0; z-index: 100; background: transparent; }
      #hud {
        position: fixed; bottom: 16px; right: 20px;
        z-index: 9999; pointer-events: none;
        font-family: monospace; font-size: 13px;
        color: rgba(255,255,255,0.45); letter-spacing: 0.08em;
        transition: opacity 0.2s;
      }
      body.presenter-mode #hud { bottom: 168px; }
      body.ui-hidden #hud      { opacity: 0; }
      body.ui-hidden, body.ui-hidden #overlay { cursor: none; }
    </style>
  </head>
  <body>
    <iframe id="frame" allow="autoplay; fullscreen"></iframe>
    <div id="overlay"></div>
    <div id="hud"></div>
    <div id="presenter-bar">
      <div id="preview-track"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
      // ═══════════════════════════════════════════════════════════
      //  MASTER CONFIGURATION — only edit values in this block
      // ═══════════════════════════════════════════════════════════

      const TRANSITION_SOUND = "";

      // Firebase client keys are public by design — security is handled by Firebase Rules.
      const firebaseConfig = {
        apiKey: "AIzaSyB4zuxfFvcZb3d2qQCIt1xROtTbbPyJtqk",
        authDomain: "mouthwashing-visuals.firebaseapp.com",
        databaseURL: "https://mouthwashing-visuals-default-rtdb.firebaseio.com/",
        projectId: "mouthwashing-visuals",
        storageBucket: "mouthwashing-visuals.firebasestorage.app",
        messagingSenderId: "903836033913",
        appId: "1:903836033913:web:44ce661f530a1450cec5a8",
        measurementId: "G-D2SHZCY3DP",
      };

      const SLIDES = [
        "black.html", // Black screen (start)
        "1.html",     // Opening info card
        "black.html",
        "2.html",     // 0 days before the crash
        "black.html",
        "3.html",     // Orbital body detected (typewriter)
        "black.html",
        "4.html",     // Extreme warning, collision course (typewriter)
        "black.html",
        "5.html",     // AUTOPILOT DISENGAGED / BRACE FOR IMPACT (flash)
        "black.html",
        "9.html",     // 2 months after the crash
        "black.html",
        "6.html",     // 7 days before the crash
        "black.html",
        "7.html",     // ////// Apologize //////
        "black.html",
        "8.html",     // ////// Talk to Jimmy //////
        "black.html",
        "10.html",    // MESSAGE INCOMING (flash)
        "11.html",    // Mouthwashing ad video (no black before)
        "black.html",
        "9.html",     // 2 months after the crash (repeat)
        "black.html",
        "35.html",    // 6 days before the crash
        "black.html",
        "12.html",    // 3 months after the crash
        "36.html",    // pony.MOV video (no black before)
        "black.html",
        "13.html",    // 4 months after the crash
        "black.html",
        "14.html",    // ////// Break The Foam //////
        "black.html",
        "15.html",    // Take Responsibility — Take Care Of It
        "black.html",
        "15.html",    // Take Responsibility — Take Care Of It (repeat)
        "black.html",
        "16.html",    // 4 days before the crash
        "black.html",
        "17.html",    // Safety
        "black.html",
        "18.html",    // 5 months after the crash
        "black.html",
        "19.html",    // ////// Save him //////
        "black.html",
        "20.html",    // ////// Deal With Swansea //////
        "black.html",
        "21.html",    // 8 hours until judgement
        "black.html",
        "22.html",    // 1 day before the crash
        "black.html",
        "23.html",    // ////// Find The Gun //////
        "black.html",
        "24.html",    // 6 hours until judgement
        "black.html",
        "25.html",    // ////// Get The Gun //////
        "black.html",
        "26.html",    // 0 days before the crash (red)
        "black.html",
        "27.html",    // Kills Ninety Nine Percent — Take Care Of It
        "black.html",
        "15.html",    // Take Responsibility — Take Care Of It
        "black.html",
        "15.html",    // Take Responsibility — Take Care Of It (repeat)
        "black.html",
        "27.html",    // Kills Ninety Nine Percent — Take Care Of It (repeat)
        "black.html",
        "28.html",    // Kills Ninety Nine Percent ×3 (fast fade)
        "black.html",
        "29.html",    // System Failure (flash)
        "black.html",
        "30.html",    // ////// Take Care of Swansea //////
        "black.html",
        "31.html",    // ////// Say Sorry //////
        "black.html",
        "32.html",    // ////// Apologize //////
        "black.html",
        "33.html",    // 0 hours before judgement
        "black.html",
        "34.html",    // ////// Go Home //////
        "black.html", // Black screen (end)
      ];

      const SLIDE_LABELS = {
        "black.html": "",
        "1.html":  "Opening info card",
        "2.html":  "0 days before the crash",
        "3.html":  "Orbital body detected",
        "4.html":  "Extreme warning — collision course",
        "5.html":  "AUTOPILOT DISENGAGED / BRACE FOR IMPACT",
        "6.html":  "7 days before the crash",
        "7.html":  "////// Apologize //////",
        "8.html":  "////// Talk to Jimmy //////",
        "9.html":  "2 months after the crash",
        "10.html": "MESSAGE INCOMING",
        "11.html": "Mouthwashing ad (video)",
        "12.html": "3 months after the crash",
        "13.html": "4 months after the crash",
        "14.html": "////// Break The Foam //////",
        "15.html": "Take Responsibility — Take Care Of It",
        "16.html": "4 days before the crash",
        "17.html": "Safety",
        "18.html": "5 months after the crash",
        "19.html": "////// Save him //////",
        "20.html": "////// Deal With Swansea //////",
        "21.html": "8 hours until judgement",
        "22.html": "1 day before the crash",
        "23.html": "////// Find The Gun //////",
        "24.html": "6 hours until judgement",
        "25.html": "////// Get The Gun //////",
        "26.html": "0 days before the crash (red)",
        "27.html": "Kills 99% — Take Care Of It",
        "28.html": "Kills 99% ×3 (fast fade)",
        "29.html": "System Failure",
        "30.html": "////// Take Care of Swansea //////",
        "31.html": "////// Say Sorry //////",
        "32.html": "////// Apologize //////",
        "33.html": "0 hours before judgement",
        "34.html": "////// Go Home //////",
        "35.html": "6 days before the crash",
        "36.html": "Pony (video)",
      };

      // Injected into every preview iframe on load:
      //   – removes VHS scanline / vignette pseudo-elements
      //   – fast-forwards all animations to their finished (fill-forwards) state
      const PREVIEW_CSS = `
        body::before, body::after { display:none!important; }
        * {
          animation-duration: 0.001ms!important;
          animation-delay: 0ms!important;
          animation-iteration-count: 1!important;
          transition-duration: 0.001ms!important;
          transition-delay: 0ms!important;
        }
      `;

      // Card dimensions (must match CSS)
      const CARD_FULL  = 192;
      const CARD_BLACK = 18;
      const CARD_GAP   = 6;
      const TRACK_PAD  = 24;

      // ═══════════════════════════════════════════════════════════

      let isHost = new URLSearchParams(location.search).has("host");
      let presenterBarInited = false;

      firebase.initializeApp(firebaseConfig);
      const slideRef = firebase.database().ref("currentSlide");

      let current = 0;
      const frame   = document.getElementById("frame");
      const hud     = document.getElementById("hud");
      const overlay = document.getElementById("overlay");
      const track   = document.getElementById("preview-track");

      function applyMode() {
        document.body.classList.toggle("presenter-mode", isHost);
        if (isHost && !presenterBarInited) {
          initPreviewBar();
          presenterBarInited = true;
        }
        if (isHost) updateTrackPosition();
        // Refresh HUD label and preview active state
        loadSlide(current);
        if (isHost) slideRef.set(current);
      }

      if (isHost) document.body.classList.add("presenter-mode");

      let audio = null;
      if (TRANSITION_SOUND) { audio = new Audio(TRANSITION_SOUND); audio.preload = "auto"; }
      function playSound() {
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      // ── Presenter preview bar ──────────────────────────────────
      // One card element per SLIDES entry, created once and never
      // removed. Navigation only changes the active class + translateX.

      const cardEls = []; // indexed by SLIDES position

      function injectPreviewCSS(iframe) {
        try {
          const doc = iframe.contentDocument;
          if (!doc?.head) return;
          const s = doc.createElement("style");
          s.textContent = PREVIEW_CSS;
          doc.head.appendChild(s);
          // Mute and freeze any video to a static first frame
          const vid = doc.querySelector("video");
          if (vid) { vid.muted = true; vid.autoplay = false; vid.pause(); vid.currentTime = 0; }
        } catch (e) {}
      }

      function cardWidth(i) {
        return SLIDES[i] === "black.html" ? CARD_BLACK : CARD_FULL;
      }

      // X coordinate of the centre of card i, relative to track left edge
      // (track has TRACK_PAD left padding baked in)
      function cardCenterX(i) {
        let x = TRACK_PAD;
        for (let j = 0; j < i; j++) x += cardWidth(j) + CARD_GAP;
        x += cardWidth(i) / 2;
        return x;
      }

      function updateTrackPosition() {
        const barW = document.getElementById("presenter-bar").clientWidth;
        const tx   = barW / 2 - cardCenterX(current);
        track.style.transform = `translateX(${tx}px)`;
      }

      function updateActiveCard() {
        cardEls.forEach((el, i) => el.classList.toggle("active", i === current));
      }

      function initPreviewBar() {
        if (!isHost) return;

        // Build all card elements — no iframes loaded yet
        SLIDES.forEach((file, i) => {
          const isBlack = file === "black.html";
          const card    = document.createElement("div");
          card.className = "preview-card" + (isBlack ? " black-slide" : "");
          card.addEventListener("click", () => goTo(i));

          if (!isBlack) {
            const pFrame = document.createElement("iframe");
            pFrame.allow = "autoplay";
            pFrame.addEventListener("load", () => injectPreviewCSS(pFrame));
            card.appendChild(pFrame);

            const label = document.createElement("div");
            label.className = "preview-label";
            label.textContent = `${i + 1}  ${SLIDE_LABELS[file] ?? file}`;
            card.appendChild(label);
          }

          track.appendChild(card);
          cardEls.push(card);
        });

        // Stagger-load iframes sorted by distance from slide 0 so nearby
        // previews appear first; browser queues ~6 parallel loads at a time.
        const loadOrder = SLIDES
          .map((file, i) => ({ file, i }))
          .filter(({ file }) => file !== "black.html")
          .sort((a, b) => Math.abs(a.i - current) - Math.abs(b.i - current));

        loadOrder.forEach(({ file, i }, seq) => {
          const iframe = cardEls[i]?.querySelector("iframe");
          if (iframe) setTimeout(() => { iframe.src = file; }, seq * 35);
        });
      }

      // ── Core slide functions ───────────────────────────────────

      function loadSlide(index) {
        current = Math.max(0, Math.min(SLIDES.length - 1, index));
        frame.src = SLIDES[current];
        const mode = isHost ? "HOST  " : "VIEWER  ";
        hud.textContent = `${mode}${current + 1} / ${SLIDES.length}  —  ${SLIDES[current]}`;
        updateActiveCard();
        updateTrackPosition();
      }

      function goTo(index) {
        loadSlide(index);
        if (isHost) slideRef.set(current);
      }

      slideRef.on("value", (snap) => {
        const val = snap.val();
        if (val !== null && val !== current) loadSlide(val);
      });

      frame.addEventListener("load", () => {
        try {
          const vid = frame.contentDocument.querySelector("video");
          if (vid) vid.play().catch(() => {});
        } catch (e) {}
      });

      // ── Focus lock ─────────────────────────────────────────────
      overlay.addEventListener("click", () => window.focus());
      window.addEventListener("blur", () => setTimeout(() => window.focus(), 0));

      // ── Key handling ───────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.key === "n" || e.key === "N") { document.body.classList.toggle("ui-hidden"); return; }
        if (e.key === "t" || e.key === "T") { isHost = !isHost; applyMode(); return; }
        if (e.key === "f" || e.key === "F") {
          (!document.fullscreenElement
            ? document.documentElement.requestFullscreen()
            : document.exitFullscreen()
          ).catch(() => {});
          return;
        }
        if (!isHost) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") {
          e.preventDefault(); playSound(); goTo(current + 1);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault(); playSound(); goTo(current - 1);
        }
      });

      initPreviewBar();
      loadSlide(0);

      // ── Screen Wake Lock — keeps display on while tab is active ──
      if ("wakeLock" in navigator) {
        let wakeLock = null;
        const requestWakeLock = async () => {
          try { wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
        };
        requestWakeLock();
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") requestWakeLock();
        });
      }
    </script>
  </body>
</html>
