<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+TC&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="master.css" />
    <style>
      body {
        background-color: rgb(0, 0, 0);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        padding: 40px 0;
      }
      * {
        font-family: "WDXL Lubrifont TC", sans-serif;
        font-weight: 400;
        font-style: normal;
        margin: 0;
      }
      .line {
        color: var(--color-warning);
        font-size: 56pt;
        line-height: 1;
        text-transform: uppercase;
        text-align: center;
        margin: 2px 0;
        clip-path: inset(0 100% 0 0);
      }
      .line:nth-child(1) { animation: reveal 0.85s steps(17, end) forwards; animation-delay: 0.5s;  }
      .line:nth-child(2) { animation: reveal 1.2s  steps(24, end) forwards; animation-delay: 1.9s;  }
      .line:nth-child(3) { animation: reveal 1.55s steps(31, end) forwards; animation-delay: 3.5s;  }
      .line:nth-child(4) { animation: reveal 2.0s  steps(40, end) forwards; animation-delay: 5.4s;  }
      .line:nth-child(5) { animation: reveal 2.15s steps(43, end) forwards; animation-delay: 7.8s;  }
      .line:nth-child(6) { animation: reveal 2.05s steps(41, end) forwards; animation-delay: 10.3s; }
      .line:nth-child(7) { animation: reveal 1.75s steps(35, end) forwards; animation-delay: 12.7s; }

      @keyframes reveal {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0% 0 0); }
      }

      /* ═══ VHS OVERLAY ═══ */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 999;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.15) 2px,
          rgba(0, 0, 0, 0.15) 4px
        );
        animation: vhsFlicker 0.15s infinite;
      }
      body::after {
        content: "";
        position: fixed;
        inset: -10px;
        z-index: 998;
        pointer-events: none;
        box-shadow:
          inset 4px 0 12px rgba(255, 0, 0, 0.06),
          inset -4px 0 12px rgba(0, 100, 255, 0.06);
        background: radial-gradient(
          ellipse at center,
          transparent 60%,
          rgba(0, 0, 0, 0.4) 100%
        );
      }
      @keyframes vhsFlicker {
        0%   { opacity: 0.97; }
        50%  { opacity: 1; }
        100% { opacity: 0.98; }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div class="line">Extreme Warning!</div>
    <div class="line">Direct collision course</div>
    <div class="line">with orbital body 1.9 AU away.</div>
    <div class="line">Engaging auto-pilot to recorrect vessel.</div>
    <div class="line">Advise crew to take up emergency positions.</div>
    <div class="line">4000 Credits docked from crew pay package</div>
    <div class="line">for failure of navigational staff.</div>
  </body>
</html>
